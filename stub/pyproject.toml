[project]
name = "deeplabel-model-stub"
version = "1.0.0"
license = "Apache-2.0"
description = "The deterministic model backend the e2e suite runs against"
requires-python = ">=3.10"
dependencies = ["deeplabel-backend"]

[project.scripts]
deeplabel-stub = "deeplabel_stub.server:main"
deeplabel-stub-train = "deeplabel_stub.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabel_stub"]

[tool.uv.sources]
deeplabel-backend = { path = "../sdk", editable = true }
