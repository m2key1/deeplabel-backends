[project]
name = "deeplabel-backend"
version = "1.0.0"
license = "Apache-2.0"
description = "Server side of DeepLabel's model backend contract: wrap a model in a few hooks"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=10",
    "httpx>=0.28",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabel_backend"]
